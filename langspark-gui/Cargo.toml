[package]
name = "langspark-gui"
version = "0.1.0"
edition = "2021"
authors = ["Jacob Andresen <jacob.andresen@gmail.com>"]
description = "LangSpark GTK4 UI: vocabulary browser, review queue, pronunciation practice"
license = "GPL-3.0"

[dependencies]
# GTK4 and libadwaita
gtk4 = { version = "0.11.4", features = ["gnome_49"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5", "gtk_v4_18"] }
gdk4 = "0.11.4"
glib = "0.22.8"
gio = "0.22.8"

# Core logic (default-features = false so this crate's own `asr` feature is
# the single place that toggles it, rather than getting it implicitly via
# langspark-core's default — see [features] below)
langspark-core = { path = "../langspark-core", default-features = false }

# Async
tokio = { version = "1.0", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
directories = "6.0.0"
anyhow = "1.0.104"
thiserror = "2.0.19"

[dev-dependencies]
# For UI testing
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.27.0"

[features]
default = ["asr"]
# Real speech recognition (langspark-core's `qwen3-asr-rs`-backed
# SpeechRecognizer). Requires a native libtorch install — `scripts/install.sh`
# and `scripts/setup-asr.sh` set one up automatically. Build with
# `--no-default-features` if libtorch isn't available; `SpeechRecognizer`
# degrades gracefully to a clear "unavailable" error without it (see asr.rs).
asr = ["langspark-core/asr"]

[package]
name = "langspark-gui"
version = "0.1.0"
edition = "2021"
authors = ["Jacob Andresen <jacob.andresen@gmail.com>"]
description = "LangSpark GTK4 UI: vocabulary browser, review queue, pronunciation practice"
license = "GPL-3.0"

[dependencies]
# GTK4 and libadwaita
# Note: Version numbers below need verification - these are placeholders
# gtk4 = { version = "0.18", features = ["v4_6"] }
# gdk4 = "0.18"
# glib = "0.18"
# gio = "0.18"
# libadwaita = { version = "0.5", features = ["v1_4"] }

# Core logic
langspark-core = { path = "../langspark-core" }

# Async
tokio = { version = "1.0", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
# For UI testing
assert_cmd = "2.0"
predicates = "3.0"

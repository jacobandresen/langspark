name: Release builds

# Builds installable packages and attaches them to a GitHub Release:
#   - windows:   langspark-gui.exe + its GTK4/libadwaita DLLs, packaged as a
#                real .msi installer via cargo-wix (see wix/main.wxs)
#   - linux-deb: a .deb for Debian/Ubuntu (via cargo-deb)
#
# Both build with --no-default-features, i.e. without the `asr` speech
# recognition feature: that needs libtorch, which dynamically links as a hard
# runtime dependency with no baked-in path (confirmed via `ldd`/`readelf` on a
# built binary — reliably bundling that into a package is its own project, not
# attempted here). A build without ASR still runs everything except the
# Pronunciation tab (which only appears once a speech recognition model is
# installed — see app.rs::asr_model_installed, and preferences.rs's
# `#[cfg(feature = "asr")]`-gated install row, which is compiled out
# entirely in these builds so there's nothing there that could mislead a user
# into installing a model that can't work); VOICEVOX playback, vocabulary,
# review, paragraph translation, and the SRS engine are unaffected. See
# README.md's "Speech recognition" section, or scripts/install.sh, for a
# from-source build that includes ASR.
#
# Every other in-app "Preferences -> Study -> Language Installation" download
# (dictionary, Tatoeba examples, VOICEVOX Engine, book catalog, paragraph
# translation) is a plain HTTP download with no subprocess/script involved —
# see langspark-core/src/installer.rs.
#
# Runs when a GitHub Release is published (the real release build, uploaded
# to that release) or manually via workflow_dispatch (for iterating on CI
# changes without publishing a release — builds and packages but skips the
# upload step, see each job's "Attach to release" `if:` condition).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # needed to attach build artifacts to the release below

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # MSYS2's own Rust toolchain (rather than rustup) so pkg-config picks
      # up MSYS2-installed GTK4/libadwaita automatically — the toolchain
      # triple (gnu) has to match the libraries' toolchain, which rustup's
      # default Windows install (msvc) doesn't.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Build
        run: cargo build --release -p langspark-gui --no-default-features

      # GTK apps on Windows need their DLLs alongside the .exe (no
      # system-wide GTK the way Linux distros have) — ntldd walks the full
      # dependency tree, not just direct links, and we only pull in the ones
      # MSYS2 actually installed (ucrt64\bin), not Windows system DLLs.
      - name: Collect runtime DLLs
        run: |
          mkdir -p dist
          cp target/release/langspark-gui.exe dist/
          cp -r langspark-gui/data dist/
          ntldd -R target/release/langspark-gui.exe \
            | grep -i '/ucrt64/bin/' \
            | awk '{print $3}' \
            | sort -u \
            | xargs -I{} cp -u {} dist/

      # langspark-gui/wix/main.wxs references a `DistFiles` ComponentGroup
      # for every DLL in `dist/` (see that file's header comment for why
      # this isn't hand-maintained: MSYS2's GTK4/libadwaita package set —
      # and so the DLL list `ntldd` reports above — changes over time).
      # cargo-wix auto-includes every `.wxs` file it finds under the
      # package's `wix/` directory, so writing this there is enough to pull
      # it into the build with no extra `--include` flag. Source paths are
      # absolute (via $GITHUB_WORKSPACE, which GitHub Actions always sets)
      # rather than relative to `dist/`, matching main.wxs's own paths — see
      # its header comment for why.
      - name: Generate WiX DLL component list
        run: |
          {
            echo "<?xml version='1.0' encoding='windows-1252'?>"
            echo "<Wix xmlns='http://schemas.microsoft.com/wix/2006/wi'>"
            echo "  <Fragment>"
            echo "    <DirectoryRef Id='APPLICATIONFOLDER'>"
            for f in dist/*.dll; do
              name=$(basename "$f")
              id=$(echo "$name" | sed -E 's/[^A-Za-z0-9_.]/_/g')
              case "$id" in [0-9]*) id="_$id" ;; esac
              echo "      <Component Id='Dll_${id}' Guid='*'>"
              echo "        <File Id='DllFile_${id}' Name='${name}' DiskId='1' Source='\$(env.GITHUB_WORKSPACE)\\dist\\${name}' KeyPath='yes'/>"
              echo "      </Component>"
            done
            echo "    </DirectoryRef>"
            echo "    <ComponentGroup Id='DistFiles'>"
            for f in dist/*.dll; do
              name=$(basename "$f")
              id=$(echo "$name" | sed -E 's/[^A-Za-z0-9_.]/_/g')
              case "$id" in [0-9]*) id="_$id" ;; esac
              echo "      <ComponentRef Id='Dll_${id}'/>"
            done
            echo "    </ComponentGroup>"
            echo "  </Fragment>"
            echo "</Wix>"
          } > langspark-gui/wix/harvested.wxs

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      # `--no-build`: reuse the binary already built above (and the `dist/`
      # layout assembled from it) instead of cargo-wix triggering its own
      # `cargo build --release` — wix/main.wxs's <File Source> paths point at
      # `dist\...` directly rather than cargo-wix's usual
      # `$(var.CargoTargetBinDir)` (see that file's header comment).
      - name: Build .msi
        run: cargo wix --no-build --nocapture -p langspark-gui -o LangSpark-windows-x64.msi

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" LangSpark-windows-x64.msi --clobber

  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same package list as scripts/install.sh's install_dependencies(),
      # minus Docker (not needed to build).
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgtk-4-dev libadwaita-1-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb -p langspark-gui -- --no-default-features

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/debian/*.deb --clobber

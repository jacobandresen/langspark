[package]
name = "langspark-core"
version = "0.1.0"
edition = "2021"
authors = ["Jacob Andresen <jacob.andresen@gmail.com>"]
description = "LangSpark core logic: SRS, dictionaries, audio processing, language management"
license = "GPL-3.0"
readme = "README.md"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.30", features = ["bundled", "backup"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"

# Date/time handling
chrono = "0.4"

# Language management
strum = { version = "0.25", features = ["derive"] }

# Audio capture/playback
cpal = "0.15"
rodio = { version = "0.17", default-features = false, features = ["wav"] }
hound = "3.5"

# TTS (Japanese) - the `voicevox-rs`/`voicevox_core` crates don't build (the former
# has a broken upstream release, the latter isn't published to crates.io at all), so
# instead we speak VOICEVOX Engine's local HTTP API directly with a minimal client.
ureq = { version = "2", features = ["json"] }

# Dictionary installer: downloads jmdict-simplified's .json.tgz release assets
# and unpacks the JSON member.
flate2 = "1.0"
tar = "0.4"

# Example-sentence installer: decompresses Tatoeba's .tsv.bz2 exports
# (pure-Rust decoder only, no system libbz2 dependency).
bzip2-rs = "0.1"

# ASR - requires a libtorch install (LIBTORCH env var or system-wide /usr/lib/libtorch.so).
# Enabled by default; `scripts/setup-asr.sh` (run automatically by `scripts/install.sh`)
# installs a version-pinned libtorch so this builds out of the box. Build with
# `--no-default-features` (or disable just `asr`) if libtorch isn't available.
qwen3-asr-rs = { version = "0.2", optional = true }

[features]
default = ["asr"]
# Speech recognition needs qwen3-asr-rs's tch backend (a native libtorch
# install) or mlx (Apple Silicon only). See the dependency comment above.
asr = ["dep:qwen3-asr-rs"]

[dev-dependencies]
tempfile = "3.8"
mockall = "0.11"
# For the examples/install_dictionary.rs helper (used by scripts/install.sh),
# which needs the same XDG dictionaries-dir convention langspark-gui's
# AppDirs uses.
directories = "6.0.0"

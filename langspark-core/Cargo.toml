[package]
name = "langspark-core"
version = "0.1.0"
edition = "2021"
authors = ["Jacob Andresen <jacob.andresen@gmail.com>"]
description = "LangSpark core logic: SRS, dictionaries, audio processing, language management"
license = "GPL-3.0"
readme = "README.md"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.30", features = ["bundled", "backup"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"

# Async
tokio = { version = "1.0", features = ["full"] }

# Date/time handling
chrono = "0.4"

# Language management
strum = { version = "0.25", features = ["derive"] }

# Audio capture/playback
cpal = "0.15"
rodio = { version = "0.17", default-features = false, features = ["wav"] }
hound = "3.5"

# TTS (Japanese) - the `voicevox-rs`/`voicevox_core` crates don't build (the former
# has a broken upstream release, the latter isn't published to crates.io at all), so
# instead we speak VOICEVOX Engine's local HTTP API directly with a minimal client.
ureq = { version = "2", features = ["json"] }

# Dictionary installer: downloads jmdict-simplified's .json.tgz release assets
# and unpacks the JSON member.
flate2 = "1.0"
tar = "0.4"

# TTS (Spanish and others) - ONNX runtime + espeak-ng phonemizer, no libtorch needed
piper-rs = { version = "0.2", default-features = false }

# ASR - requires a libtorch install (LIBTORCH env var or system-wide /usr/lib/libtorch.so);
# not available in every build environment, so it's opt-in via the `asr` feature.
qwen3-asr-rs = { version = "0.2", optional = true }

[features]
# Speech recognition is feature-gated because qwen3-asr-rs's only backends are
# tch (needs a native libtorch install) and mlx (Apple Silicon only) - neither
# is guaranteed to be present, so the default build must not require it.
asr = ["dep:qwen3-asr-rs"]

[dev-dependencies]
tempfile = "3.8"
mockall = "0.11"
